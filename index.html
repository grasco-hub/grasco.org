<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>GRASCO | Stronger Together, Better Communities</title>

*{
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
font-family:Arial,sans-serif;
color:#17324d;
line-height:1.6;
}

header{
padding:12px 5%;
border-bottom:1px solid #ddd;
background:white;
display:flex;
align-items:center;
justify-content:space-between;
gap:20px;
flex-wrap:wrap;
}

header img{
width:190px;
height:auto;
max-width:100%;
display:block;
}

nav{
display:flex;
gap:6px;
align-items:center;
overflow-x:auto;
white-space:nowrap;
-webkit-overflow-scrolling:touch;
padding:5px 0;
}

nav a{
text-decoration:none;
color:#0b587c;
font-weight:bold;
padding:9px 11px;
border-radius:6px;
}

nav a:hover{
background:#f2f7f8;
}

.hero{
padding:85px 6%;
text-align:center;
color:white;
background:linear-gradient(135deg,#0b6fa4,#08735f);
}

h1{
font-size:clamp(38px,7vw,62px);
line-height:1.1;
}

.hero p{
font-size:22px;
}

.btn{
display:inline-block;
padding:12px 20px;
margin:6px;
border-radius:7px;
background:white;
color:#08735f;
text-decoration:none;
font-weight:bold;
}

.btn.orange{
background:#f39a27;
color:white;
}

section{
max-width:1100px;
margin:auto;
padding:60px 6%;
}

h2{
color:#0b587c;
font-size:34px;
}

.about-intro{
font-size:19px;
}

.about-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
margin-top:30px;
}

.about-card{
padding:22px;
border:1px solid #ddd;
border-radius:10px;
background:#f7fafb;
}

.about-card h3{
color:#08735f;
margin-top:0;
}

.about-card p{
margin-bottom:0;
}

.about-list{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:25px;
}

.about-item{
padding:20px;
border-left:5px solid #08735f;
background:#f7fafb;
}

.about-item h3{
margin-top:0;
color:#0b587c;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

border:1px solid #ddd;
border-radius:10px;
background:#f7fafb;
}
