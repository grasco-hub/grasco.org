<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="GRASCO - Grassroots Resource and Skills for Community Opportunities">
<title>GRASCO | Stronger Together, Better Communities</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:#17324d;
  line-height:1.65;
  background:#fff;
}
header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#fff;
  border-bottom:1px solid #dfe5e8;
  padding:10px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

header img{
  width:190px;
  max-height:75px;
  object-fit:contain;
  display:block;
}



.hero{
  padding:92px 6%;
  text-align:center;
  color:#fff;
  background:linear-gradient(135deg,#0b6fa4,#08735f);
}
.hero h1{
  font-size:clamp(38px,7vw,68px);
  line-height:1.08;
  margin:0 0 18px;
}
.hero h2{
  font-size:clamp(22px,4vw,34px);
  margin:0 0 15px;
  color:#fff;
}
.hero p{
  font-size:21px;
  max-width:850px;
  margin:0 auto 25px;
}
.btn{
  display:inline-block;
  padding:12px 21px;
  margin:6px;
  border-radius:8px;
  background:#fff;
  color:#08735f;
  text-decoration:none;
  font-weight:bold;
}
.btn.orange{background:#f39a27;color:#fff}
.btn.blue{background:#0b587c;color:#fff}

section{
  max-width:1120px;
  margin:auto;
  padding:68px 6%;
}
section h2{
  color:#0b587c;
  font-size:35px;
  margin:0 0 15px;
}
.section-intro{
  font-size:18px;
  max-width:900px;
}
.alt{
  background:#f2f7f8;
  max-width:none;
}
.alt>div{max-width:1120px;margin:auto}

.about-grid,
.cards,
.pillar-grid,
.network-grid,
.structure-grid,
.team-grid,
.contact-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:20px;
  margin-top:28px;
}

.about-card,
.card,
.pillar,
.network-card,
.structure-card,
.team-card,
.contact-card{
  padding:23px;
  border:1px solid #dce3e6;
  border-radius:13px;
  background:#f8fbfc;
}
.about-card h3,
.card h3,
.pillar h3,
.network-card h3,
.structure-card h3,
.team-card h3,
.contact-card h3{
  color:#08735f;
  margin-top:0;
}
.about-card p,.card p,.pillar p,.network-card p,
.structure-card p,.team-card p,.contact-card p{margin-bottom:0}

.service-icon{
  width:48px;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#0b587c;
  color:#fff;
  font-weight:bold;
  font-size:20px;
  margin-bottom:12px;
}

.pillar span{
  display:inline-block;
  background:#0b587c;
  color:#fff;
  border-radius:50%;
  width:36px;
  height:36px;
  text-align:center;
  line-height:36px;
  margin-bottom:10px;
  font-weight:bold;
}

.network-banner{
  background:#0b587c;
  color:#fff;
  max-width:none;
  text-align:center;
}
.network-banner h2{color:#fff}
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:15px;
  margin-top:28px;
}
.stat{
  padding:20px;
  background:#fff;
  color:#0b587c;
  border-radius:10px;
  text-align:center;
}
.stat strong{
  display:block;
  font-size:30px;
  color:#08735f;
}

.structure-flow{
  margin-top:25px;
  padding:25px;
  background:#f7fafb;
  border-radius:12px;
  border:1px solid #ddd;
}
.structure-flow p{margin:9px 0}

.team-intro{
  background:#eef7f5;
  border-left:5px solid #08735f;
  padding:18px 20px;
  border-radius:8px;
  margin-top:22px;
}

.team-photo{
  width:100%;
  height:210px;
  object-fit:cover;
  border-radius:10px;
  background:#dfe9ed;
  display:block;
}
.photo-placeholder{
  height:210px;
  border-radius:10px;
  background:linear-gradient(135deg,#dfe9ed,#eef4f6);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#547080;
  font-weight:bold;
  letter-spacing:.5px;
}
.team-role{
  font-size:14px;
  font-weight:bold;
  color:#0b587c;
  margin:5px 0 10px;
}
.team-note{
  font-size:14px;
  color:#526873;
}

.verify{
  background:#0b587c;
  color:#fff;
  max-width:none;
  text-align:center;
}
.verify h2{color:#fff}

.contact-card a{
  color:#0b587c;
  font-weight:bold;
  text-decoration:none;
}

footer{
  padding:34px 6%;
  text-align:center;background:#122b3d;
  color:#fff;
}
footer strong{font-size:21px}

.back-top{
  display:inline-block;
  margin-top:15px;
  color:#fff;
  text-decoration:none;
  font-weight:bold;
}

@media(max-width:1000px){
  header{padding:9px 4%;position:sticky}
  .logo-box{width:160px;height:68px}
  .nav-picker-btn{min-width:165px}
}
@media(max-width:600px){
  header img{width:160px;max-height:65px}
  .hero{padding:65px 5%}
  .hero p{font-size:18px}
  section{padding:50px 5%}
  section h2{font-size:29px}
  .team-photo,.photo-placeholder{height:190px}
}

.logo-link{display:flex;align-items:center;flex-shrink:0;text-decoration:none}
.logo-box{
  width:190px;height:78px;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.logo-box img{
  width:100%;height:100%;
  object-fit:contain;
  display:block;
}
.nav-picker{position:relative;z-index:1100}
.nav-picker-btn{
  min-width:190px;
  border:1px solid #0b587c;
  background:#0b587c;
  color:#fff;
  padding:13px 17px;
  border-radius:9px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}
.nav-picker-btn .arrow{font-size:12px}
.explore-menu{
  display:none;
  position:absolute;
  right:0;
  top:calc(100% + 7px);
  width:280px;
  max-height:70vh;
  overflow-y:auto;
  background:#fff;
  border:1px solid #d8e1e5;
  border-radius:10px;
  box-shadow:0 12px 28px rgba(0,0,0,.18);
}
.explore-menu.open{display:block}
.explore-menu a{
  display:block;
  padding:14px 17px;
  border-bottom:1px solid #edf1f3;
  color:#0b587c;
  text-decoration:none;
  font-weight:bold;
  background:#fff;
}
.explore-menu a:last-child{border-bottom:0}
.explore-menu a:hover,.explore-menu a:focus{
  background:#eef7f5;
  color:#08735f;
}

@media(max-width:600px){
  .nav-picker-btn{min-width:155px;padding:12px 13px;font-size:14px}
  .explore-menu{width:min(300px,88vw);right:0}
  .logo-box{width:150px;height:64px}
}

.verification-panel{
  max-width:760px;
  margin:28px auto 8px;
  text-align:left;
}
.verification-toggle{
  width:100%;
  border:1px solid rgba(255,255,255,.35);
  background:#fff;
  color:#0b587c;
  border-radius:10px;
  padding:15px 18px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}
.verification-arrow{font-size:12px}
.verification-steps{
  display:none;
  margin-top:8px;
  background:#fff;
  color:#17324d;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,.12);
}
.verification-steps.open{display:block}
.verification-step{
  display:flex;
  gap:15px;
  padding:17px 18px;
  border-bottom:1px solid #e4eaed;
}
.verification-step:last-child{border-bottom:0}
.step-number{
  flex:0 0 34px;
  width:34px;
  height:34px;
  border-radius:50%;
  background:#0b587c;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}
.verification-step strong{
  color:#08735f;
  display:block;
  margin-bottom:3px;
}
.verification-step p{margin:0;font-size:14px}


.verification-options{max-width:820px;margin:25px auto;text-align:left}
.verification-option{
  background:#fff;
  border-radius:11px;
  margin:12px 0;
  overflow:hidden;
  box-shadow:0 5px 16px rgba(0,0,0,.12);
}
.verification-option-btn{
  width:100%;
  border:0;
  background:#fff;
  color:#0b587c;
  padding:17px 19px;
  font-size:16px;
  font-weight:bold;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
  text-align:left;
}
.verification-option-btn:hover{background:#f1f7f8}
.verification-option-content{
  display:none;
  padding:18px 19px 21px;
  color:#17324d;
  border-top:1px solid #e3eaed;
}
.verification-option-content.open{display:block}
.verification-option-content label{
  display:block;
  margin:12px 0 5px;
  font-weight:bold;
}
.verification-option-content input{
  width:100%;
  padding:12px;
  border:1px solid #b9c8cf;
  border-radius:7px;
  font-size:16px;
}
.verify-action{
  margin-top:14px;
  border:0;
  border-radius:7px;
  padding:12px 18px;
  background:#08735f;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}
.qr-area,.verification-result{
  margin-top:18px;
  padding:15px;
  border-radius:8px;
  background:#f2f7f8;
  min-height:20px;
}
.verification-note{font-size:13px;opacity:.9}


.required-message{
  margin-top:12px;
  padding:12px 14px;
  border-radius:8px;
  background:#fff3cd;
  border:1px solid #f0c36d;
  color:#8a5200;
  font-size:14px;
}
.required-message strong{
  color:#b02a37;
}


.training-application{
  padding:60px 5%;
  background:#f4f8f8;
  color:#17324d;
}
.training-application h2{text-align:center;color:#0b587c}
.training-application .section-intro{text-align:center;font-size:18px}
.problem-checklist{
  max-width:850px;
  margin:25px auto;
  display:grid;
  gap:10px;
}
.problem-item{
  display:flex;
  gap:12px;
  align-items:flex-start;
  padding:15px;
  background:#fff;
  border:1px solid #d8e3e6;
  border-radius:9px;
  cursor:pointer;
}
.problem-item input{margin-top:4px;transform:scale(1.2)}
.training-threshold{
  max-width:850px;margin:25px auto;
  padding:20px;
  text-align:center;
  background:#fff;
  border-radius:10px;
  box-shadow:0 5px 16px rgba(0,0,0,.08);
}
.training-open-btn,.training-submit-btn{
  display:block;
  margin:15px auto 0;
  border:0;
  border-radius:8px;
  padding:13px 20px;
  background:#08735f;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}
.training-open-btn:hover,.training-submit-btn:hover{opacity:.9}
.training-details{
  display:none;
  max-width:850px;
  margin:25px auto 0;
  padding:25px;
  background:#fff;
  border-radius:10px;
  box-shadow:0 5px 18px rgba(0,0,0,.1);
}
.training-details.open{display:block}
.training-details h3{color:#0b587c}
.training-details h4{color:#08735f;margin-top:25px}
.training-details label:not(.application-consent){
  display:block;
  margin:13px 0 5px;
  font-weight:bold;
}
.training-details input[type="text"],
.training-details input[type="tel"],
.training-details input[type="number"],
.training-details textarea{
  width:100%;
  padding:12px;
  border:1px solid #b9c8cf;
  border-radius:7px;
  font-size:16px;
  box-sizing:border-box;
}
.application-consent{
  display:flex;
  gap:10px;
  align-items:flex-start;
  margin:18px 0;
  font-size:14px;
}
.application-consent input{margin-top:3px}
.training-message{
  margin-top:12px;
  padding:12px 14px;
  border-radius:8px;
  background:#fff3cd;
  border:1px solid #f0c36d;
  color:#8a5200;
  display:none;
}
.training-message.show{display:block}
.service-request-list{display:grid;gap:9px;margin:8px 0 14px}
.service-request-list label{display:flex !important;align-items:flex-start;gap:10px;margin:0 !important;padding:11px 12px;background:#f7fafb;border:1px solid #d8e3e6;border-radius:7px;font-weight:normal !important}
.service-request-list input{margin-top:3px}


.verification-webapp-wrap{
  width:100%;
  max-width:980px;
  margin:28px auto 16px;
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,.16);
}
.verification-webapp{
  display:block;
  width:100%;
  height:820px;
  border:0;
  background:#fff;
}
.verification-external{
  margin:14px 0 8px;
  font-size:14px;
}
.verification-open-btn{
  margin:6px 0 12px;
}
@media(max-width:600px){
  .verification-webapp{height:900px;}
}

</style>

<style id="grasco-header-clean-style">
.grasco-header-clean{
  display:flex !important;
  flex-direction:column !important;
  align-items:center !important;
  justify-content:center !important;
  gap:12px !important;
  padding:16px 12px 14px !important;
}
.grasco-header-clean .logo-link{
  display:block !important;
  width:100% !important;
  text-align:center !important;
}
.grasco-header-clean .logo-box{
  display:flex !important;
  justify-content:center !important;
  align-items:center !important;
  margin:0 auto !important;
}
.grasco-header-clean .logo-box img{
  display:block !important;
  margin:0 auto !important;
}
.grasco-top-actions{
  display:flex !important;
  flex-direction:row !important;
  justify-content:center !important;

}

}
.grasco-top-actions .nav-picker-btn,

  width:100% !important;

}
@media (max-width:520px){
  .grasco-header-clean{padding-left:8px !important;padding-right:8px !important;}
  .grasco-top-actions{gap:6px !important;}
  .grasco-top-actions .nav-picker-btn,
  .grasco-top-actions .btn{

</style>

<style id="grasco-header-final-fix">

  background:#fff !important;
  padding:12px 14px 14px !important;

  border-bottom:1px solid #dfe5e8 !important;
}
.grasco-header-clean .logo-box{

}

.grasco-top-actions .nav-picker{position:relative !important;}
@media(max-width:520px){
  .grasco-header-clean{padding:9px 9px 12px !important;gap:9px !important;}
  .grasco-header-clean .logo-box{width:150px !important;height:78px !important;}
  .grasco-top-actions{gap:6px !important;}
  .grasco-top-actions .nav-picker-btn,
  .grasco-top-actions .btn{min-height:48px !important;padding:10px 5px !important;font-size:12px !important;}

</head>
