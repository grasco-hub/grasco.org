<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="GRASCO - Grassroots Resource and Skills for Community Opportunities">
<title>GRASCO | Stronger Together, Better Communities</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:#17324d;
  line-height:1.65;
  background:#fff;
}
header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#fff;
  border-bottom:1px solid #dfe5e8;
  padding:10px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

header img{
  width:190px;
  max-height:75px;
  object-fit:contain;
  display:block;
}



.hero{
  padding:92px 6%;
  text-align:center;
  color:#fff;
  background:linear-gradient(135deg,#0b6fa4,#08735f);
}
.hero h1{
  font-size:clamp(38px,7vw,68px);
  line-height:1.08;
  margin:0 0 18px;
}
.hero h2{
  font-size:clamp(22px,4vw,34px);
  margin:0 0 15px;
  color:#fff;
}
.hero p{
  font-size:21px;
  max-width:850px;
  margin:0 auto 25px;
}
.btn{
  display:inline-block;
  padding:12px 21px;
  margin:6px;
  border-radius:8px;
  background:#fff;
  color:#08735f;
  text-decoration:none;
  font-weight:bold;
}
.btn.orange{background:#f39a27;color:#fff}
.btn.blue{background:#0b587c;color:#fff}

section{
  max-width:1120px;
  margin:auto;
  padding:68px 6%;
}
section h2{
  color:#0b587c;
  font-size:35px;
  margin:0 0 15px;
}
.section-intro{
  font-size:18px;
  max-width:900px;
}
.alt{
  background:#f2f7f8;
  max-width:none;
}
.alt>div{max-width:1120px;margin:auto}

.about-grid,
.cards,
.pillar-grid,
.network-grid,
.structure-grid,
.team-grid,
.contact-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:20px;
  margin-top:28px;
}

.about-card,
.card,
.pillar,
.network-card,
.structure-card,
.team-card,
.contact-card{
  padding:23px;
  border:1px solid #dce3e6;
  border-radius:13px;
  background:#f8fbfc;
}
.about-card h3,
.card h3,
.pillar h3,
.network-card h3,
.structure-card h3,
.team-card h3,
.contact-card h3{
  color:#08735f;
  margin-top:0;
}
.about-card p,.card p,.pillar p,.network-card p,
.structure-card p,.team-card p,.contact-card p{margin-bottom:0}

.service-icon{
  width:48px;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#0b587c;
  color:#fff;
  font-weight:bold;
  font-size:20px;
  margin-bottom:12px;
}

.pillar span{
  display:inline-block;
  background:#0b587c;
  color:#fff;
  border-radius:50%;
  width:36px;
  height:36px;
  text-align:center;
  line-height:36px;
  margin-bottom:10px;
  font-weight:bold;
}

.network-banner{
  background:#0b587c;
  color:#fff;
  max-width:none;
  text-align:center;
}
.network-banner h2{color:#fff}
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:15px;
  margin-top:28px;
}
.stat{
  padding:20px;
  background:#fff;
  color:#0b587c;
  border-radius:10px;
  text-align:center;
}
.stat strong{
  display:block;
  font-size:30px;
  color:#08735f;
}

.structure-flow{
  margin-top:25px;
  padding:25px;
  background:#f7fafb;
  border-radius:12px;
  border:1px solid #ddd;
}
.structure-flow p{margin:9px 0}

.team-intro{
  background:#eef7f5;
  border-left:5px solid #08735f;
  padding:18px 20px;
  border-radius:8px;
  margin-top:22px;
}

.team-photo{
  width:100%;
  height:210px;
  object-fit:cover;
  border-radius:10px;
  background:#dfe9ed;
  display:block;
}
.photo-placeholder{
  height:210px;
  border-radius:10px;
  background:linear-gradient(135deg,#dfe9ed,#eef4f6);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#547080;
  font-weight:bold;
  letter-spacing:.5px;
}
.team-role{
  font-size:14px;
  font-weight:bold;
  color:#0b587c;
  margin:5px 0 10px;
}
.team-note{
  font-size:14px;
  color:#526873;
}

.verify{
  background:#0b587c;
  color:#fff;
  max-width:none;
  text-align:center;
}
.verify h2{color:#fff}

.contact-card a{
  color:#0b587c;
  font-weight:bold;
  text-decoration:none;
}

footer{
  padding:34px 6%;
  text-align:center;
